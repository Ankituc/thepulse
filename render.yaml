services:
  - type: web
    name: thepulse
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: GNEWS_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /tmp/thepulse.sqlite
