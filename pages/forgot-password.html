<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password help — ThePulse</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="info-page">
  <main class="info-card">
    <a class="info-back" href="login.html">← Back to login</a>
    <p class="info-kicker">ACCOUNT HELP</p>
    <h1>Reset your password</h1>
    <p class="info-intro">Request a one-time reset link by email. The link expires after 30 minutes. Email delivery must be configured by the site owner.</p>
    <form id="resetRequestForm" class="contact-form">
      <label for="resetEmail">Email address</label>
      <input id="resetEmail" type="email" autocomplete="email" maxlength="254" required />
      <button class="btn-primary" type="submit">Send reset link</button>
    </form>
    <form id="resetCompleteForm" class="contact-form" hidden>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required />
      <button class="btn-primary" type="submit">Update password</button>
    </form>
    <p id="resetStatus" class="form-status" role="status" aria-live="polite"></p>
  </main>
  <script src="../js/password-reset.js"></script>
</body>
</html>
